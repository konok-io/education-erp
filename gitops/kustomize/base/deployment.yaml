apiVersion: apps/v1
kind: Deployment
metadata:
  name: education-erp
  labels:
    app: education-erp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: education-erp
  template:
    metadata:
      labels:
        app: education-erp
    spec:
      containers:
        - name: education-erp
          image: education-erp:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: production
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
