# FluxCD Kustomization for Education ERP
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: education-erp
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: education-erp-infra
    namespace: flux-system
  path: ./environments/production
  prune: true
  wait: true
  timeout: 10m0s
  postBuild:
    substitute:
      APP_ENV: production
      APP_VERSION: "${COMMIT_SHA}"
  images:
    - name: education-erp
      newName: ghcr.io/education-erp/education-erp
      newTag: latest

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: education-erp-infra
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: education-erp-git-credentials
  url: https://github.com/education-erp/infrastructure.git
  ignore: |
    .github/
    .gitignore
    README.md

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: education-erp-config
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: education-erp-infra
    namespace: flux-system
  path: ./config/production
  prune: true
  wait: true

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: education-erp-secrets
  namespace: flux-system
spec:
  interval: 24h
  sourceRef:
    kind: GitRepository
    name: education-erp-infra
    namespace: flux-system
  path: ./secrets/production
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: education-erp
  namespace: production
spec:
  imageRepositoryRef:
    name: education-erp
  policy:
    semver:
      range: 3.x.x
  filterTags:
    pattern: '^v(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)$'
    extraction: 'v{$major}.{$minor}.{$patch}'

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: education-erp
  namespace: production
spec:
  image: ghcr.io/education-erp/education-erp
  interval: 1m0s
  secretRef:
    name: ghcr-credentials
  exclude: test

---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: education-erp
  namespace: flux-system
spec:
  providerRef:
    name: slack
  eventSeverity:
    - error
    - info
  eventSources:
    - kind: Kustomization
      name: '*'
      namespace: '*'
  suspend: false

---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Provider
metadata:
  name: slack
  namespace: flux-system
spec:
  type: slack
  channel: '#devops'
  secretRef:
    name: slack-webhook
