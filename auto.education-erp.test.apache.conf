# Education ERP - Laragon Apache Configuration
# Place this file in: C:\laragon\etc\apache\sites-enabled\

# Education ERP - Single Domain Setup
<VirtualHost *:80>
    DocumentRoot "C:/laragon/www/education-erp/backend/public"
    ServerName education-erp.test
    ServerAlias api.education-erp.test
    
    <Directory "C:/laragon/www/education-erp/backend/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Laravel rewrite rules
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>
    
    # PHP settings
    <FilesMatch "\.php$">
        SetHandler application/x-httpd-php
    </FilesMatch>
</VirtualHost>
