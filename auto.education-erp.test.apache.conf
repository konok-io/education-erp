# Education ERP - Laragon Apache Configuration
# Place this file in: C:\laragon\etc\apache\sites-enabled\

# Frontend (React/Vite)
<VirtualHost *:80>
    DocumentRoot "C:/laragon/www/education-erp/frontend"
    ServerName education-erp.test
    <Directory "C:/laragon/www/education-erp/frontend">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        # Vite dev server proxy
        ProxyPass /api http://localhost:8000/api
        ProxyPassReverse /api http://localhost:8000/api
    </Directory>
</VirtualHost>

# Backend (Laravel API)
<VirtualHost *:80>
    DocumentRoot "C:/laragon/www/education-erp/backend/public"
    ServerName api.education-erp.test
    <Directory "C:/laragon/www/education-erp/backend/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
