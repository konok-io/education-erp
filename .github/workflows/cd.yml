name: CD Pipeline

on:
  workflow_run:
    workflow: CI Pipeline
    types: [completed]
    branches: [main]

env:
  KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}

jobs:
  deploy-development:
    name: Deploy to Development
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Configure kubectl
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > $KUBECONFIG
          cat $KUBECONFIG

      - name: Deploy to Development
        run: |
          helm upgrade --install education-erp ./helm/education-erp \
            --namespace development \
            --create-namespace \
            --values ./helm/education-erp/values-dev.yaml \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 10m

      - name: Run Health Checks
        run: |
          kubectl rollout status deployment/education-erp-backend -n development
          kubectl rollout status deployment/education-erp-frontend -n development

      - name: Notify Success
        if: success()
        run: echo "Successfully deployed to Development"

  deploy-qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs: deploy-development
    environment: qa
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Configure kubectl
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > $KUBECONFIG

      - name: Deploy to QA
        run: |
          helm upgrade --install education-erp ./helm/education-erp \
            --namespace qa \
            --create-namespace \
            --values ./helm/education-erp/values-qa.yaml \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 10m

      - name: Run Smoke Tests
        run: |
          curl -f https://qa.education-erp.example.com/health || exit 1
          curl -f https://qa.education-erp.example.com/api/health || exit 1

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs: deploy-qa
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Configure kubectl
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > $KUBECONFIG

      - name: Deploy to Staging (Blue/Green)
        run: |
          helm upgrade --install education-erp ./helm/education-erp \
            --namespace staging \
            --create-namespace \
            --values ./helm/education-erp/values-staging.yaml \
            --values ./helm/education-erp/values-blue-green.yaml \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 15m

      - name: Run Integration Tests
        run: |
          npm run test:integration -- --environment=staging

      - name: Switch Traffic
        run: |
          kubectl patch service education-erp -n staging \
            --type=merge -p '{"spec":{"selector":{"version":"new"}}}'

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs: deploy-staging
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Configure kubectl
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > $KUBECONFIG

      - name: Deploy to Production (Canary)
        run: |
          helm upgrade --install education-erp ./helm/education-erp \
            --namespace production \
            --create-namespace \
            --values ./helm/education-erp/values-production.yaml \
            --values ./helm/education-erp/values-canary.yaml \
            --set image.tag=${{ github.sha }} \
            --set canary.replicas=1 \
            --wait --timeout 20m

      - name: Monitor Canary
        run: |
          echo "Monitoring canary deployment..."
          sleep 60
          kubectl get pods -n production -l app=education-erp,track=canary

      - name: Promote Canary
        if: success()
        run: |
          kubectl scale deployment education-erp-backend -n production --replicas=3
          kubectl scale deployment education-erp-frontend -n production --replicas=3

      - name: Notify Success
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Production deployment successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Successful*\nCommit: `${{ github.sha }}`"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.action == 'rollback' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Configure kubectl
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > $KUBECONFIG

      - name: Rollback
        run: |
          helm rollback education-erp production -n production --wait --timeout 10m

      - name: Notify Rollback
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Production rollback triggered",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Rollback Triggered*\nReason: ${{ github.event.inputs.reason }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
