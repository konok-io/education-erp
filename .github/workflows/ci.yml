name: CI Pipeline

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'development'

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '20'
  COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, curl, zip, gd, mysql, pdo
          coverage: xdebug

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: PHP Code Sniffer
        working-directory: backend
        run: composer phpcs

      - name: PHPStan
        working-directory: backend
        run: composer phpstan

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript Check
        working-directory: frontend
        run: npm run type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: education_erp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, curl, zip, gd, mysql, pdo
          coverage: xdebug

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Copy Environment
        working-directory: backend
        run: cp .env.example .env

      - name: Generate Application Key
        working-directory: backend
        run: php artisan key:generate

      - name: Create Testing Database
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS education_erp_test;"

      - name: Run Migrations
        working-directory: backend
        run: php artisan migrate --force

      - name: PHPUnit
        working-directory: backend
        run: composer test

      - name: Jest
        working-directory: frontend
        run: npm run test -- --coverage --ci

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml,./frontend/coverage/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Backend
        working-directory: backend
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            backend/bootstrap/cache/config.php
            backend/bootstrap/cache/routes.php
            backend/storage/framework/views/*.php
            frontend/dist/**/*

      - name: Push to Container Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.REGISTRY }}/education-erp:${{ github.sha }}
            ${{ secrets.REGISTRY }}/education-erp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            "composer_auth=${{ env.COMPOSER_AUTH }}"
