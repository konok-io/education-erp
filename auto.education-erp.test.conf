# Education ERP - Laragon Nginx Configuration
# Place this file in: C:\laragon\etc\nginx\sites-enabled\
# Or use Laragon Menu > Nginx > Site > Add > Auto...

server {
    listen 80;
    listen [::]:80;
    server_name auto.education-erp.test;
    
    root "C:/laragon/www/education-erp/backend/public";
    index index.php index.html index.htm;

    charset utf-8;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Laravel pretty URLs
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # API routes - Laravel backend
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Frontend static files (built React app)
    location /assets {
        alias C:/laragon/www/education-erp/frontend/dist/assets;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Frontend index
    location = / {
        alias C:/laragon/www/education-erp/frontend/dist/index.html;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|gif|png|webp|svg|ico|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # PHP processing
    location ~ \.php$ {
        fastcgi_pass php-tcp;
        fastcgi_index index.php;
        fastcgi_read_timeout 300;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages
    error_page 404 /index.php;
}

